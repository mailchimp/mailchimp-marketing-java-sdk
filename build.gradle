plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'com.diffplug.spotless' version '6.11.0'
}

repositories {
    mavenCentral()
    maven {
        url 'https://s01.oss.sonatype.org/content/repositories/releases/'
    }
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:5.2.1'
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.6'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.6'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.2'
}


sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.withType(Javadoc) {
    failOnError false
    options.addStringOption('Xdoclint:none', '-quiet')
}

spotless {
    java {
        palantirJavaFormat()
    }
}


java {
    withSourcesJar()
    withJavadocJar()
}


group = 'com.mailchimp'

version = '0.0.197'

jar {
    dependsOn(":generatePomFileForMavenPublication")
    archiveBaseName = "mailchimp-marketing"
}

sourcesJar {
    archiveBaseName = "mailchimp-marketing"
}

javadocJar {
    archiveBaseName = "mailchimp-marketing"
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.mailchimp'
            artifactId = 'mailchimp-marketing'
            version = '0.0.197'
            from components.java
            pom {
                name = 'mailchimp-marketing'
                description = 'The Mailchimp Java library provides convenient access to the Mailchimp Marketing API.'
                url = 'https://github.com/mailchimp/mailchimp-marketing-java-sdk'
                licenses {
                    license {
                        name = 'The MIT License (MIT)'
                        url = 'https://mit-license.org/'
                    }
                }
                developers {
                    developer {
                        name = 'Mailchimp'
                        organization = 'Mailchimp'
                        organizationUrl = 'https://mailchimp.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/mailchimp/mailchimp-marketing-java-sdk.git'
                    developerConnection = 'scm:git:git://github.com/mailchimp/mailchimp-marketing-java-sdk.git'
                    url = 'https://github.com/mailchimp/mailchimp-marketing-java-sdk'
                }
            }
        }
    }
    repositories {
        maven {
            url "$System.env.MAVEN_PUBLISH_REGISTRY_URL"
            credentials {
                username "$System.env.MAVEN_USERNAME"
                password "$System.env.MAVEN_PASSWORD"
            }
        }
    }
}

signing {
    def signingKeyId = findProperty("signing.keyId")
    def signingKey = findProperty("signing.key")
    def signingPassword = findProperty("signing.password")
    if (signingKey) {
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    } else {
        useGpgCmd()
    }
    sign publishing.publications.maven
}

